name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer. setup-node is used
      # without registry-url on purpose: that option writes an .npmrc with an
      # _authToken placeholder and exports a dummy NODE_AUTH_TOKEN, which makes
      # npm publish with a static token instead of the workflow OIDC identity.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: Report npm auth source
        run: |
          echo "registry: $(npm config get registry)"
          echo "npm: $(npm --version)"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "auth: static token present"
          else
            echo "auth: no token, npm publishes through OIDC"
          fi

      - name: Preflight tag and package versions
        id: preflight
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tagName = process.env.TAG_NAME;
          if (!tagName || !/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tagName)) {
            throw new Error(`Invalid release tag: ${tagName ?? "missing"}.`);
          }

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const version = tagName.slice(1);
          if (packageJson.version !== version) {
            throw new Error(`Tag ${tagName} does not match package.json version ${packageJson.version}.`);
          }
          if (packageLock.version !== version) {
            throw new Error(`Tag ${tagName} does not match package-lock.json version ${packageLock.version}.`);
          }
          console.log(`Preflight passed for ${tagName} (version ${version}).`);
          NODE

      - name: Install exact dependencies
        run: npm ci

      - name: Resolve npm publication state
        id: npm-state
        env:
          PACKAGE_NAME: "@rizquuula/paperclip-omp-adapter"
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_NUM="${VERSION#v}"
          set +e
          npm view "$PACKAGE_NAME@$VERSION_NUM" version > /dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Version $VERSION_NUM already published on npm, skipping publish step."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: npm exchanges this workflow's OIDC token for publish
      # rights, so no long-lived NPM_TOKEN secret is required.
      - name: Publish to npm
        if: steps.npm-state.outputs.publish == 'true'
        run: npm publish --access public --provenance

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
          else
            gh release create "$TAG_NAME" --generate-notes --verify-tag
          fi

